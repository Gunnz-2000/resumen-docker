version: "3.8"

services:
  backend:
    build: ./backend
    container_name: backend_flask

  frontend:
    image: nginx:1.25-alpine
    container_name: frontend_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    #espera a que el backend este listo antes de iniciar
    depends_on:
      - backend